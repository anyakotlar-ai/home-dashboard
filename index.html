<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Dashboard</title>

  <style>
    :root {
      --tile-width: 160px;
      --tile-height: 92px;
      --col-gap: 24px;
      --row-gap: 18px;
      --radius: 20px;
      --text: #202124;
      --tile-bg: rgba(50, 50, 50, .10);
      --shadow: 0 7px 20px rgba(50,50,70,.13);

      /* Google apps popup */
      --apps-bg: rgba(156, 159, 186, .94);
      --apps-hover: rgba(255,255,255,.09);
      --apps-text: rgba(255,255,255,.94);
      --apps-muted: rgba(255,255,255,.70);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
          radial-gradient(circle at center, #c2c2c2 0%, #b6b6b6 58%, #a5a5a5 100%);
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 34px 24px 24px;
    }

    .top-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-bottom: 42px;
      position: relative;
    }

    .search-form {
      width: min(760px, 78vw);
      position: relative;
    }

    .search-input {
      width: 100%;
      height: 56px;
      border: 0;
      outline: none;
      border-radius: 28px;
      padding: 0 58px 0 54px;
      font-size: 18px;
      background: rgba(255,255,255,.93);
      box-shadow: var(--shadow);
    }

    .search-g {
      position: absolute;
      left: 21px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 21px;
      font-weight: 700;
      color: #4285f4;
      pointer-events: none;
    }

    .search-icon {
      position: absolute;
      right: 22px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
      opacity: .65;
      pointer-events: none;
    }

    .apps-wrap {
      position: relative;
    }

    .apps-button {
      width: 56px;
      height: 56px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.93);
      box-shadow: var(--shadow);
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 0;
    }

    .dot-grid {
      display: grid;
      grid-template-columns: repeat(3, 5px);
      gap: 4px;
    }

    .dot-grid span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #5f6368;
    }

    /* 3 columns × 4 rows */
    .apps-panel {
      display: none;
      position: absolute;
      right: 0;
      top: 68px;
      width: 330px;
      padding: 18px;
      border-radius: 22px;
      background: var(--apps-bg);
      box-shadow: 0 18px 42px rgba(36, 36, 52, .30);
      backdrop-filter: blur(10px);
      z-index: 20;
    }

    .apps-panel.open {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px 8px;
    }

    .app-link {
      min-width: 0;
      text-decoration: none;
      color: var(--apps-text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 7px;
      padding: 10px 4px 9px;
      border-radius: 14px;
      font-size: 12.5px;
      line-height: 1.15;
      text-align: center;
      transition: background .12s ease, transform .12s ease;
    }

    .app-link:hover {
      background: var(--apps-hover);
      transform: translateY(-1px);
    }

    .app-link img {
      width: 38px;
      height: 38px;
      object-fit: contain;
      display: block;
    }

    .app-label {
      max-width: 86px;
      min-height: 29px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      color: var(--apps-text);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, var(--tile-width));
      justify-content: center;
      column-gap: var(--col-gap);
      row-gap: var(--row-gap);
    }

    .site {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
    }

    .tile {
      width: var(--tile-width);
      height: var(--tile-height);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius);
      background: var(--tile-bg);
      border: 1px solid rgba(255,255,255,.32);
      box-shadow: var(--shadow);
      text-decoration: none;
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    }

    a.tile:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(50,50,70,.17);
      background: rgba(255,255,255,.97);
    }

    .tile img {
      width: 52px;
      height: 52px;
      object-fit: contain;
    }

    .label {
      width: var(--tile-width);
      text-align: center;
      font-size: 15px;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: rgba(0, 0, 0, .82);
    }

    .empty .tile {
      border: 2px dashed rgba(80,80,100,.18);
      box-shadow: none;
      background: rgba(255,255,255,.28);
      color: rgba(40,40,50,.38);
      font-size: 34px;
    }

    .empty .label {
      color: rgba(40,40,50,.38);
    }

    @media (max-width: 760px) {
      .grid { grid-template-columns: repeat(3, var(--tile-width)); }
      body { overflow: auto; }
    }

    @media (max-width: 560px) {
      :root {
        --tile-width: 140px;
        --tile-height: 84px;
        --col-gap: 18px;
      }
      .grid { grid-template-columns: repeat(2, var(--tile-width)); }
      .top-row { margin-bottom: 30px; }
      .page { padding-top: 24px; }
      .apps-panel { right: -20px; width: 310px; }
    }
  </style>
</head>

<body>

        </div>
      </div>
    </div>

  </main>

  <script>
    const appsButton = document.getElementById('appsButton');
    const appsPanel = document.getElementById('appsPanel');

    appsButton.addEventListener('click', function (event) {
      event.stopPropagation();
      appsPanel.classList.toggle('open');
    });

    document.addEventListener('click', function (event) {
      if (!appsPanel.contains(event.target) && !appsButton.contains(event.target)) {
        appsPanel.classList.remove('open');
      }
    });
  </script>
